# Streamlit theme for the tutor (see app.py for the rest of the styling).
[theme]
base = "light"
primaryColor = "#A8492A"            # terracotta accent
backgroundColor = "#F7F4EE"         # warm paper
secondaryBackgroundColor = "#EFEAE1"
textColor = "#1F1D1A"               # ink
font = "serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
